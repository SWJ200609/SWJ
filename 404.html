<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121218" media="(prefers-color-scheme: dark)">
<title>页面不存在 · CET-6 &amp; 考研英语二考点手册</title>
<style>
  :root{--bg:#faf9f7;--fg:#1e1e22;--muted:#6d6b75;--accent:#3a6ea5}
  @media(prefers-color-scheme:dark){:root{--bg:#121218;--fg:#e8e6e1;--muted:#9a97a0;--accent:#7fb0e8}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);padding:0 20px
       calc(48px + env(safe-area-inset-bottom,0px));
       font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  main{max-width:620px;margin:0 auto;padding-top:13vh}
  .code{font-size:clamp(56px,16vw,96px);line-height:1;font-weight:700;
        letter-spacing:-.02em;color:var(--accent)}
  h1{font-size:1.35rem;margin:18px 0 8px}
  p{color:var(--muted);margin:0 0 28px}
  a.btn{display:inline-block;padding:11px 22px;border-radius:11px;
        background:var(--accent);color:#fff;text-decoration:none;font-size:.95rem}
  a.plain{display:inline-block;margin-top:16px;color:var(--muted);
          font-size:.85rem;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>这一页不存在</h1>
  <p>链接可能拼错了，或者页面已经被移动。从首页重新进一下就好。</p>
  <a class="btn" href="index.html">&#8592; 返回首页</a>
  <br>
  <a class="plain" href="javascript:history.back()">返回上一页</a>
</main>
</body>
</html>
